# Flatpak manifest for Kustik Screenshot.
#
# Builds offline from a prepared source tree: the UI bundle (ui/dist) and the
# Rust crates (helper/vendor) are generated first. Locally and in CI that's
# the checkout (./flatpak/build.sh prepares it). The release archive
# (./flatpak/dist.sh) has the same layout, for manifests that build from it.
id: xyz.kustik.Screenshot
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: kustik-screenshot

finish-args:
  # The overlay is a layer-shell surface and frames come from wlr-screencopy.
  # Compositors (niri among them) hide those protocols from clients that come
  # through Flatpak's Wayland socket, which is tagged as sandboxed. So instead
  # of --socket=wayland the app gets the session's own socket as a file; the
  # launcher finds it. Covers the usual display names.
  - --filesystem=xdg-run/wayland-0
  - --filesystem=xdg-run/wayland-1
  - --filesystem=xdg-run/wayland-2
  - --socket=x11                 # X11 sessions (the launcher picks Wayland when there is one)
  - --share=ipc                  # X11 shared memory
  - --device=dri                 # GPU video encoding (VAAPI) and WebKit rendering
  - --socket=pulseaudio          # microphone and system audio
  - --filesystem=xdg-pictures/Screenshots:create
  - --filesystem=xdg-videos/Recordings:create
  # Recording indicator in the system tray (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*

modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=true
      - -Dvapi=false
    sources:
      - type: git
        url: https://github.com/wmww/gtk4-layer-shell.git
        tag: v1.3.0
        commit: 1c963c51514581c41b9bdae08cdf69171265cdda

  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: git
        url: https://github.com/bugaevc/wl-clipboard.git
        tag: v2.3.0
        commit: 67a7b937895bceec1ae5ccebb10216f63f70ca1b

  - name: kustik-screenshot-helper
    buildsystem: simple
    subdir: helper
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/kustik-screenshot-helper/cargo
    build-commands:
      - mkdir -p /run/build/kustik-screenshot-helper/cargo
      - printf '[source.crates-io]\nreplace-with = "vendored"\n[source.vendored]\ndirectory = "/run/build/kustik-screenshot-helper/helper/vendor"\n' > /run/build/kustik-screenshot-helper/cargo/config.toml
      - cargo build --release --offline
      - install -Dm755 target/release/kustik-screenshot-helper /app/bin/kustik-screenshot-helper
    sources:
      - type: dir
        path: ..
        skip: [helper/target, flatpak/.build, flatpak/.repo, flatpak/dist, .git, site, docs]

  - name: kustik-screenshot
    buildsystem: simple
    build-commands:
      - install -Dm755 kustik-screenshot /app/bin/kustik-screenshot
      - find kustik_screenshot -name '*.py' -exec install -Dm644 {} /app/share/kustik-screenshot/{} ';'
      - install -Dm644 -t /app/share/kustik-screenshot/ui ui/index.html ui/styles.css
      - install -Dm644 -t /app/share/kustik-screenshot/ui/dist ui/dist/app.js
      - install -Dm644 -t /app/share/kustik-screenshot/ui/fonts ui/fonts/*.woff2
      - install -Dm644 flatpak/xyz.kustik.Screenshot.desktop /app/share/applications/xyz.kustik.Screenshot.desktop
      - install -Dm644 flatpak/xyz.kustik.Screenshot.svg /app/share/icons/hicolor/scalable/apps/xyz.kustik.Screenshot.svg
      - install -Dm644 flatpak/xyz.kustik.Screenshot.metainfo.xml /app/share/metainfo/xyz.kustik.Screenshot.metainfo.xml
      # D-Bus activation: the shortcut reaches the app even if it isn't running yet.
      - mkdir -p /app/share/dbus-1/services
      - printf '[D-BUS Service]\nName=xyz.kustik.Screenshot\nExec=/app/bin/kustik-screenshot --gapplication-service\n' > /app/share/dbus-1/services/xyz.kustik.Screenshot.service
    sources:
      - type: dir
        path: ..
        skip: [helper, flatpak/.build, flatpak/.repo, flatpak/dist, .git, site, docs]
